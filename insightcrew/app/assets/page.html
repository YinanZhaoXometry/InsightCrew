<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self'; img-src data:">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>InsightCrew</title>
<style>
/*@@css*/
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="brand">InsightCrew</div>
      <h1 id="title">多智能体交易辅助系统</h1>
      <div id="subtitle">数字由代码计算并复算，方案由代码按规则审计，模型只负责判断。</div>
    </div>
    <div class="head-side">
      <span class="pill" id="run-state" hidden></span>
      <span class="badge" id="badge" hidden></span>
    </div>
  </header>
  <p class="disclaimer">本页面由课程项目自动生成，不构成投资建议；系统不执行、不路由、也不模拟任何订单。</p>
  <div class="banner" id="banner" hidden></div>

  <section class="card" id="launch" hidden>
    <h2>发起一次运行</h2>
    <form id="form">
      <label>离线场景 <select id="f-scenario"></select></label>
      <label>代码 <input id="f-ticker" maxlength="32" placeholder="ACME / 0700.HK" list="tickers" autocomplete="off"></label>
      <datalist id="tickers"></datalist>
      <label>分析日 <input id="f-date" type="date"></label>
      <label class="inline"><input id="f-judges" type="checkbox"> 模型评审</label>
      <label>辩论轮数 <input id="f-rounds" type="number" min="0" max="10"></label>
      <label>风险辩论轮数 <input id="f-risk-rounds" type="number" min="0" max="10"></label>
      <label class="inline"><input id="f-tools" type="checkbox"> 分析工具</label>
      <label class="inline"><input id="f-memory" type="checkbox"> 记忆</label>
      <label>组合文件 <input id="f-portfolio" maxlength="256" placeholder="data/portfolios/flat_usd.json" autocomplete="off"></label>
      <label>证据通道 <select id="f-channels" multiple size="5">
        <option value="fundamentals">fundamentals 基本面</option>
        <option value="disclosures">disclosures 公告</option>
        <option value="news">news 新闻</option>
        <option value="sentiment">sentiment 情感</option>
        <option value="macro">macro 宏观（需同时选 news）</option>
      </select></label>
      <button class="primary" type="submit">开始</button>
    </form>
    <p class="note" id="mode-note"></p>
    <p class="note" id="scenario-note" hidden></p>
    <p class="error" id="form-error" hidden></p>
    <details id="history"><summary>过去的运行</summary><div id="history-body" class="muted">（加载中）</div></details>
  </section>

  <main id="run" hidden>
    <section id="pipeline" aria-label="流水线"></section>

    <section class="two">
      <div class="card" id="result"></div>
      <div class="card" id="chart"></div>
    </section>

    <nav class="tabs" id="tabs" aria-label="页签" role="tablist">
      <button class="tab" type="button" role="tab" data-view="process">过程</button>
      <button class="tab" type="button" role="tab" data-view="evidence">证据</button>
      <button class="tab" type="button" role="tab" data-view="audit">规则与审计</button>
      <button class="tab" type="button" role="tab" data-view="usage">用量与耗时</button>
      <button class="tab" type="button" role="tab" data-view="events">原始事件</button>
    </nav>

    <section class="card view" id="view-process" role="tabpanel" hidden></section>
    <section class="card view" id="view-evidence" role="tabpanel" hidden></section>
    <section class="card view" id="view-audit" role="tabpanel" hidden></section>
    <section class="card view" id="view-usage" role="tabpanel" hidden></section>

    <section class="view" id="view-events" role="tabpanel" hidden>
      <section class="card" id="playbar" aria-label="回放控制">
        <button class="ctl" id="btn-play" type="button">播放</button>
        <button class="ctl" id="btn-step" type="button">单步</button>
        <span class="speed" id="speeds"><span class="muted">速度</span>
          <button class="ctl" type="button" data-speed="slow">慢</button>
          <button class="ctl" type="button" data-speed="normal">正常</button>
          <button class="ctl" type="button" data-speed="fast">快</button>
          <button class="ctl" type="button" data-speed="instant">瞬间</button>
        </span>
        <input id="slider" type="range" min="0" max="0" value="0" aria-label="回放位置">
        <span class="muted" id="progress"></span>
      </section>

      <section>
        <h2>过程记录（被否决的方案不是结论）</h2>
        <div id="lanes"></div>
        <p class="note">每条事件一张卡片，一栏是一个角色的一次出场，从左到右是发生的顺序；点卡片看它的内容。带删除线的是后来被新版本取代的产物。</p>
      </section>
    </section>
  </main>
</div>

<aside id="detail" hidden aria-label="事件详情"></aside>

<script type="application/json" id="embedded">null</script>
<script>
/* 运行页面。它的全部输入是一串事件：静态模式下嵌在 #embedded 里，实时模式下来自本地服务的事件流。
   页面自己折叠黑板，只做展示。它显示的每个价格、价位、比率与规则数值都是事件里现成的值；
   唯一的求和是模型用量（token 与调用成本）的累计。运行数据一律作为文本插入。
   源文件拆在 assets/css/ 与 assets/js/（BLUEPRINT 20.9），这里由 app/replay_html.py 拼装。 */
(() => {
"use strict";
/*@@js*/
})();
</script>
</body>
</html>
