<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self'; img-src data:">
<title>InsightCrew 运行回放</title>
<style>
  :root { --ink:#1c2330; --muted:#6b7686; --line:#dde3ec; --bg:#f5f7fa; --card:#ffffff;
          --accent:#2563eb; --good:#15803d; --bad:#b91c1c; --warn:#a16207; --lane:#eef2f7; }
  * { box-sizing: border-box; }
  body { margin:0; padding:24px; font:14px/1.55 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
         color:var(--ink); background:var(--bg); }
  h1 { font-size:20px; margin:0 0 4px; }
  h2 { font-size:15px; margin:20px 0 8px; color:var(--ink); }
  header, section, main { max-width:1060px; margin:0 auto; }
  .muted { color:var(--muted); }
  .badge { display:inline-block; padding:2px 10px; border-radius:12px; font-size:12px;
           background:#e8edf7; color:var(--accent); border:1px solid #c6d4f0; }
  .disclaimer { color:var(--muted); font-size:12px; margin-top:4px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px 14px; margin:8px 0; }
  /* 流水线条 */
  #pipeline { display:flex; gap:6px; flex-wrap:wrap; margin-top:14px; }
  .stage { padding:4px 10px; border-radius:6px; border:1px solid var(--line); background:#fff;
           font-size:12px; color:var(--muted); }
  .stage.done { background:#e7f4ec; color:var(--good); border-color:#bfe3cb; }
  .stage.running { background:#e8edf7; color:var(--accent); border-color:#c6d4f0; }
  .stage.revised { background:#fdf3e3; color:var(--warn); border-color:#ecd9b0; }
  .stage.halted { background:#fbe9e9; color:var(--bad); border-color:#efc4c4; }
  /* 播放条 */
  #playbar { display:flex; align-items:center; gap:10px; margin-top:14px; }
  #playbar button { padding:3px 12px; border:1px solid var(--line); background:#fff; border-radius:6px; cursor:pointer; }
  #playbar input[type=range] { flex:1; }
  #playbar .speed { display:flex; gap:4px; }
  #playbar .speed button.on { background:#e8edf7; color:var(--accent); border-color:#c6d4f0; }
  /* 结果 */
  #result .verdict { font-size:18px; font-weight:600; }
  #result .review { color:var(--bad); }
  #result table, #evidence table, #usage table { border-collapse:collapse; width:100%; font-size:13px; }
  #result th, #result td, #evidence th, #evidence td, #usage th, #usage td {
    border:1px solid var(--line); padding:4px 8px; text-align:left; }
  th { background:var(--lane); }
  .pass { color:var(--good); } .fail { color:var(--bad); } .na { color:var(--muted); }
  /* 时间线 */
  .lane { display:flex; gap:8px; margin:6px 0; align-items:flex-start; }
  .lane .who { width:130px; flex:none; padding:4px 8px; background:var(--lane); border-radius:6px;
               font-size:12px; color:var(--muted); }
  .lane .cards { display:flex; flex-wrap:wrap; gap:6px; }
  .ev { padding:4px 9px; border-radius:6px; border:1px solid var(--line); background:#fff;
        font-size:12px; cursor:pointer; }
  .ev:hover { border-color:var(--accent); }
  .ev.model { border-color:#c6d4f0; background:#f6f8fe; }
  .ev.gate { border-color:#bfe3cb; background:#f4faf6; }
  .ev.route { border-color:#ecd9b0; background:#fffaf0; color:var(--warn); }
  .ev.artifact { color:var(--muted); background:var(--lane); }
  .ev.finished { border-color:#efc4c4; background:#fdf3f3; }
  .ev.hiddencount { color:var(--muted); }
  #detail { display:none; position:fixed; inset:0; background:rgba(20,26,36,.45); z-index:10; }
  #detail .sheet { position:absolute; top:6%; left:50%; transform:translateX(-50%); width:min(860px, 92vw);
                   max-height:86vh; overflow:auto; background:#fff; border-radius:10px; padding:16px 20px; }
  #detail pre { white-space:pre-wrap; word-break:break-word; background:var(--lane);
                padding:10px; border-radius:6px; font-size:12px; max-height:320px; overflow:auto; }
  #detail .close { float:right; cursor:pointer; color:var(--muted); }
  svg { background:#fff; border:1px solid var(--line); border-radius:8px; }
  /* 实时模式：表单与过去的运行 */
  #live { display:none; }
  #live form { display:flex; flex-wrap:wrap; gap:8px; align-items:flex-end; }
  #live label { display:flex; flex-direction:column; font-size:12px; color:var(--muted); gap:2px; }
  #live input, #live select { padding:5px 8px; border:1px solid var(--line); border-radius:6px; font:inherit; }
  #live button { padding:6px 16px; border:1px solid var(--accent); background:var(--accent);
                 color:#fff; border-radius:6px; cursor:pointer; }
  #live .notice { color:var(--warn); font-size:12px; min-height:16px; }
  #runlist table { border-collapse:collapse; width:100%; font-size:13px; }
  #runlist td, #runlist th { border:1px solid var(--line); padding:4px 8px; text-align:left; }
  #runlist a { color:var(--accent); text-decoration:none; cursor:pointer; }
</style>
</head>
<body>
<header>
  <h1 id="head-title">InsightCrew</h1>
  <div><span class="badge" id="mode-badge"></span> <span class="muted" id="head-meta"></span></div>
  <div class="disclaimer">本页面由课程项目自动生成，不构成投资建议；系统不执行、不路由、也不模拟任何订单。脚本化运行的回复是预先写好的。</div>
</header>

<section id="pipeline" aria-label="流水线"></section>

<section id="live" class="card" aria-label="发起运行">
  <h2>发起一次运行</h2>
  <form id="run-form">
    <label>代码 <input id="f-ticker" maxlength="32" placeholder="ACME 或 0700.HK"></label>
    <label>分析日 <input id="f-asof" maxlength="10" placeholder="YYYY-MM-DD"></label>
    <label>离线场景 <select id="f-scenario"></select></label>
    <label>评审 <select id="f-judges"><option value="true">开</option><option value="false">关</option></select></label>
    <label>辩论轮数 <input id="f-rounds" type="number" min="0" max="10" style="width:64px"></label>
    <button type="submit">开始</button>
  </form>
  <div class="notice" id="live-notice"></div>
</section>

<section id="runlist" aria-label="过去的运行">
  <h2>过去的运行</h2>
  <div id="runlist-body" class="muted"></div>
</section>

<section id="playbar" aria-label="回放控制">
  <button id="btn-play">▶ 播放</button>
  <button id="btn-step">单步</button>
  <span class="speed" id="speed-box">
    <button data-speed="0.5">慢</button><button data-speed="1" class="on">正常</button>
    <button data-speed="3">快</button><button data-speed="0">瞬间</button>
  </span>
  <input id="slider" type="range" min="0" max="100" value="0">
  <span class="muted" id="progress-text"></span>
</section>

<main>
  <section class="card" id="result"></section>
  <section id="chart-wrap"><h2>收盘价（截至分析日）</h2><div id="chart"></div></section>
  <section id="evidence"><h2>证据</h2><div id="evidence-body"></div></section>
  <section id="usage"><h2>用量与成本</h2><div id="usage-body"></div></section>
  <section id="timeline"><h2>过程记录（被否决的方案不是结论）</h2><div id="lanes"></div></section>
</main>

<div id="detail"><div class="sheet"><span class="close" id="detail-close">关闭 ✕</span>
  <div id="detail-body"></div></div></div>

<script type="application/json" id="embedded">null</script>
<script>
"use strict";
/* 运行页面：一切内容都来自事件。页面自己折叠黑板，只做展示与 token 求和，不算任何行情数字。
   静态模式：#embedded 里是 {"events": [...], "bars": [...]|null}；实时模式：null，经服务器的事件流取事件。 */
(function () {
  var STAGES = ["intake", "ledger", "technical", "debate", "manager", "trader", "audit", "judges", "report"];
  var STAGE_NAME = { intake: "范围闸门", ledger: "事实账本", technical: "技术分析", debate: "多空辩论",
                     manager: "研究主管", trader: "交易员", audit: "审计", judges: "评审", report: "报告" };
  var ACTOR_STAGE = { technical: "technical", bull: "debate", bear: "debate", manager: "manager",
                      trader: "trader" };
  var MODE_TEXT = { scripted: "离线演示 · 脚本化模型（回复为预先编写）", replay: "回放 · ", model: "真实模型 · " };
  var REVIEW_REASON = { invalid_ticker: "代码格式不正确", unknown_ticker: "代码不在数据集里", no_data: "该日期之前没有已收盘的行情",
    future_date: "分析日期晚于今天", stale_data: "数据过旧", insufficient_history: "历史数据不足",
    source_unavailable: "行情数据源不可用", ledger_inconsistent: "两条计算路径的结果不一致",
    malformed_output: "模型输出两次都不合契约", stagnation: "同样的问题连续两次未被修正",
    audit_failed: "多次打回后审计仍未通过", contested: "评审多数反对，未达成共识",
    budget_exhausted: "token 预算已用尽", time_exhausted: "时间预算已用尽",
    calls_exhausted: "模型请求次数已用尽", model_unavailable: "模型不可用" };
  var JUDGE_NAME = { evidence: "证据评审", conservative: "保守评审", aggressive: "进取评审" };

  var allEvents = [];          // 完整事件列表（静态内嵌，或实时累积）
  var bars = null;
  var revealed = 0;            // 已揭示的事件数（播放进度）
  var speed = 1;
  var playing = false;
  var timer = null;

  function fold(events, upto) {
    /* 黑板折叠：取每个键最新版本。upto 之后的事件不参与（播放时逐个揭示）。 */
    var board = {};
    for (var i = 0; i < Math.min(upto, events.length); i++) {
      var e = events[i];
      if (e.type === "artifact.written") board[e.data.key] = e.data.value;
    }
    return board;
  }

  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined && text !== null) node.textContent = String(text);
    return node;
  }

  function num(v) {
    if (v === null || v === undefined) return "—";
    var s = Number(v).toFixed(4).replace(/0+$/, "").replace(/\.$/, "");
    return s === "" || s === "-" ? "0" : s;
  }

  /* ---- 头部与徽标 ---- */
  function started() {
    for (var i = 0; i < allEvents.length; i++) if (allEvents[i].type === "run.started") return allEvents[i];
    return null;
  }

  function renderHeader() {
    var s = started();
    var head = document.getElementById("head-title");
    head.textContent = "InsightCrew 运行回放";
    var badge = document.getElementById("mode-badge");
    var meta = document.getElementById("head-meta");
    badge.textContent = "";
    meta.textContent = "";
    if (!s) return;
    var mode = s.data.mode;
    var names = s.data.models || {};
    var label = MODE_TEXT[mode] || mode;
    if (mode === "model") label += names.quick + " / " + names.deep;
    if (mode === "replay") label += names.quick + " / " + names.deep;
    badge.textContent = label;
    var req = s.data.request || {};
    var board = fold(allEvents, revealed);
    var scope = board["request/scope"] || {};
    meta.textContent = (scope.ticker || req.ticker || "") + " "
      + (scope.universe !== undefined ? "（数据集 " + scope.universe + "）" : "")
      + " · 分析日 " + (scope.as_of || req.as_of || "最近交易日");
  }

  /* ---- 流水线条 ---- */
  function stageOf(e) {
    if (e.type === "gate.checked") return e.data.gate;
    if (e.type === "run.finished") return "report";
    if (e.type === "model.called" || e.type === "model.failed") {
      return ACTOR_STAGE[e.actor] || (e.actor.indexOf("judge.") === 0 ? "judges" : null);
    }
    return null;
  }

  function renderPipeline() {
    var box = document.getElementById("pipeline");
    box.textContent = "";
    var state = {};
    var lastStage = null;
    for (var i = 0; i < revealed && i < allEvents.length; i++) {
      var e = allEvents[i], st = stageOf(e);
      if (!st) continue;
      if (e.type === "route") { state[e.data.to] = "revised"; continue; }
      if (e.type === "run.finished" && e.data.status !== "delivered") { state.report = "halted"; continue; }
      state[st] = "done";
      lastStage = st;
    }
    if (lastStage) state[lastStage] = state[lastStage] === "revised" ? "revised" : "running";
    STAGES.forEach(function (name) {
      var s = state[name];
      var node = el("span", "stage" + (s ? " " + s : ""), STAGE_NAME[name] + (s === "revised" ? " ↺" : ""));
      box.appendChild(node);
    });
  }

  /* ---- 结果 ---- */
  function outcomeText(reason) { return REVIEW_REASON[reason] || reason; }

  function renderResult() {
    var box = document.getElementById("result");
    box.textContent = "";
    var board = fold(allEvents, revealed);
    var outcome = board["run/outcome"];
    if (!outcome) { box.appendChild(el("div", "muted", "（等待运行结束……）")); return; }
    if (outcome.status !== "delivered") {
      box.appendChild(el("div", "verdict review", "REVIEW：未给出评级"));
      box.appendChild(el("div", "muted", "原因：" + outcomeText(outcome.reason)));
      box.appendChild(el("div", "", "核验：" + (outcome.facts_and_rules === "verified" ? "事实与规则已核验" : "未核验")
        + "；判断：" + judgmentText(outcome.judgment)));
      return;
    }
    var thesis = board["manager/thesis"] || {};
    var proposal = board["trader/proposal"] || {};
    var instrument = board["ledger/instrument"] || {};
    box.appendChild(el("div", "verdict", "评级 " + thesis.rating + " · " + proposal.action
      + "（" + (instrument.currency || "") + "）"));
    var grid = el("table");
    var row = el("tr");
    [["入场价", num(proposal.entry)], ["止损价", num(proposal.stop)], ["目标价", num(proposal.target)],
     ["仓位", num(proposal.size_pct) + "% 权益"], ["预期持有", proposal.horizon_days + " 个交易日"]]
      .forEach(function (pair) { var th = el("th", "", pair[0]); var td = el("td", "", pair[1]); row.appendChild(th); row.appendChild(td); });
    grid.appendChild(row);
    box.appendChild(grid);
    box.appendChild(el("div", "muted", "方案说明：" + (proposal.rationale || "")));
    box.appendChild(el("div", "", "核验：" + (outcome.facts_and_rules === "verified" ? "事实与规则已核验" : "未核验")
      + "；判断：" + judgmentText(outcome.judgment)));
  }

  function judgmentText(j) {
    if (!j) return "";
    if (j.indexOf("accepted") === 0) return "评审接受（" + j.replace("accepted ", "") + "）";
    if (j === "contested") return "评审相持";
    if (j.indexOf("not reviewed") === 0) {
      var reason = j.indexOf(":") >= 0 ? j.slice(j.indexOf(":") + 1).trim() : "";
      return "未经评审" + (reason ? "（" + outcomeText(reason) + "）" : "");
    }
    return j;
  }

  /* ---- 价格图 ---- */
  function renderChart() {
    var wrap = document.getElementById("chart");
    wrap.textContent = "";
    var board = fold(allEvents, revealed);
    var outcome = board["run/outcome"];
    if (!bars || !bars.length || !outcome || outcome.status !== "delivered") {
      wrap.appendChild(el("div", "muted", bars && bars.length ? "（只有交付的方案才画价位线）" : "（没有价格序列）"));
      return;
    }
    var proposal = board["trader/proposal"] || {};
    var w = 1000, h = 260, pad = 44;
    var closes = bars.map(function (b) { return b.close; });
    var levels = [proposal.entry, proposal.stop, proposal.target].filter(function (v) { return v !== null && v !== undefined; });
    var lo = Math.min.apply(null, closes.concat(levels)), hi = Math.max.apply(null, closes.concat(levels));
    var span = (hi - lo) || 1;
    function x(i) { return pad + (w - 2 * pad) * i / Math.max(1, closes.length - 1); }
    function y(v) { return h - pad - (h - 2 * pad) * (v - lo) / span; }
    var NS = "http://www.w3.org/2000/svg";
    var svg = document.createElementNS(NS, "svg");
    svg.setAttribute("viewBox", "0 0 " + w + " " + h);
    svg.setAttribute("width", "100%");
    var path = document.createElementNS(NS, "polyline");
    path.setAttribute("fill", "none");
    path.setAttribute("stroke", "#2563eb");
    path.setAttribute("stroke-width", "1.5");
    path.setAttribute("points", closes.map(function (c, i) { return x(i) + "," + y(c); }).join(" "));
    svg.appendChild(path);
    [["entry", proposal.entry, "#15803d", "入场"], ["stop", proposal.stop, "#b91c1c", "止损"],
     ["target", proposal.target, "#a16207", "目标"]].forEach(function (lv) {
      if (lv[1] === null || lv[1] === undefined) return;
      var line = document.createElementNS(NS, "line");
      line.setAttribute("x1", pad); line.setAttribute("x2", w - pad);
      line.setAttribute("y1", y(lv[1])); line.setAttribute("y2", y(lv[1]));
      line.setAttribute("stroke", lv[2]); line.setAttribute("stroke-dasharray", "5 4");
      svg.appendChild(line);
      var label = document.createElementNS(NS, "text");
      label.setAttribute("x", pad + 4); label.setAttribute("y", y(lv[1]) - 4);
      label.setAttribute("font-size", "12"); label.setAttribute("fill", lv[2]);
      label.textContent = lv[3] + " " + num(lv[1]);
      svg.appendChild(label);
    });
    var first = document.createElementNS(NS, "text");
    first.setAttribute("x", pad); first.setAttribute("y", h - 10);
    first.setAttribute("font-size", "11"); first.setAttribute("fill", "#6b7686");
    first.textContent = bars[0].date;
    var last = document.createElementNS(NS, "text");
    last.setAttribute("x", w - pad - 60); last.setAttribute("y", h - 10);
    last.setAttribute("font-size", "11"); last.setAttribute("fill", "#6b7686");
    last.textContent = bars[bars.length - 1].date;
    svg.appendChild(first); svg.appendChild(last);
    wrap.appendChild(svg);
  }

  /* ---- 证据 ---- */
  function renderEvidence() {
    var body = document.getElementById("evidence-body");
    body.textContent = "";
    var board = fold(allEvents, revealed);
    var analysis = board["technical/analysis"];
    var facts = board["ledger/facts"] || [];
    var byId = {};
    facts.forEach(function (f) { byId[f.id] = f; });
    if (analysis && analysis.claims && analysis.claims.length) {
      body.appendChild(el("h2", "", "分析师引用的事实（数值取自账本）"));
      var t = el("table"); var head = el("tr");
      ["事实", "含义", "账本数值", "数据日", "分析师的解读"].forEach(function (h) { head.appendChild(el("th", "", h)); });
      t.appendChild(head);
      analysis.claims.forEach(function (c) {
        var f = byId[c.fact] || {};
        var tr = el("tr");
        tr.appendChild(el("td", "", c.fact));
        tr.appendChild(el("td", "", f.label || "（账本中无此事实）"));
        tr.appendChild(el("td", "", f.value !== undefined ? num(f.value) + (f.unit === "%" ? "%" : (f.unit ? " " + f.unit : "")) : "—"));
        tr.appendChild(el("td", "", f.as_of || "—"));
        tr.appendChild(el("td", "", c.reading || ""));
        t.appendChild(tr);
      });
      body.appendChild(t);
    }
    var rules = board["audit/rules"];
    if (rules && rules.length) {
      body.appendChild(el("h2", "", "风控检查"));
      var rt = el("table"); var rh = el("tr");
      ["规则", "上限", "计算值", "结论", "备注"].forEach(function (h) { rh.appendChild(el("th", "", h)); });
      rt.appendChild(rh);
      rules.forEach(function (r) {
        var tr = el("tr");
        tr.appendChild(el("td", "", r.key));
        tr.appendChild(el("td", "", num(r.limit)));
        tr.appendChild(el("td", "", num(r.actual)));
        var cls = r.status === "pass" ? "pass" : (r.status === "fail" ? "fail" : "na");
        var text = r.status === "pass" ? "通过" : (r.status === "fail" ? "不通过" : "不适用");
        tr.appendChild(el("td", cls, text));
        tr.appendChild(el("td", "", r.message || ""));
        rt.appendChild(tr);
      });
      body.appendChild(rt);
    }
    var judges = board["judges/status"];
    if (judges) {
      body.appendChild(el("h2", "", "评审意见"));
      body.appendChild(el("div", "muted", "汇总：" + judges));
      ["evidence", "conservative", "aggressive"].forEach(function (lens) {
        var v = board["judge." + lens + "/verdict"];
        if (!v) { body.appendChild(el("div", "", JUDGE_NAME[lens] + "：未询问")); return; }
        body.appendChild(el("div", "", JUDGE_NAME[lens] + "：" + (v.accept ? "接受" : "反对")
          + (v.target && v.target !== "none" ? "（" + (v.target === "thesis" ? "论点" : "价位与仓位") + "）" : "")
          + "。" + (v.critique || "")));
      });
    }
    if (!body.childNodes.length) body.appendChild(el("div", "muted", "（还没有证据）"));
  }

  /* ---- 用量 ---- */
  function renderUsage() {
    var body = document.getElementById("usage-body");
    body.textContent = "";
    var board = fold(allEvents, revealed);
    var rows = board["run/usage"];
    if (!rows || !rows.length) { body.appendChild(el("div", "muted", "（还没有模型调用）")); return; }
    var s = started();
    var ceilings = (s && s.data.ceilings) || {};
    var t = el("table"); var head = el("tr");
    ["角色", "模型", "调用", "请求", "输入 token", "输出 token", "成本"].forEach(function (h) { head.appendChild(el("th", "", h)); });
    t.appendChild(head);
    var tokens = 0;
    rows.forEach(function (r) {
      var tr = el("tr");
      tr.appendChild(el("td", "", r.role));
      tr.appendChild(el("td", "", r.model));
      tr.appendChild(el("td", "", r.calls));
      tr.appendChild(el("td", "", r.requests));
      tr.appendChild(el("td", "", r.input_tokens));
      tr.appendChild(el("td", "", r.output_tokens));
      tr.appendChild(el("td", "", r.cost === null || r.cost === undefined ? "未定价" : num(r.cost)));
      tokens += (r.input_tokens || 0) + (r.output_tokens || 0);
      t.appendChild(tr);
    });
    var total = el("tr");
    total.appendChild(el("td", "", "合计"));
    total.appendChild(el("td", "", "—"));
    total.appendChild(el("td", "", rows.reduce(function (a, r) { return a + r.calls; }, 0)));
    total.appendChild(el("td", "", rows.reduce(function (a, r) { return a + r.requests; }, 0)));
    total.appendChild(el("td", "", tokens));
    total.appendChild(el("td", "", "—"));
    total.appendChild(el("td", "", "—"));
    t.appendChild(total);
    body.appendChild(t);
    body.appendChild(el("div", "muted", "token 合计 " + tokens + "，上限 "
      + (ceilings.run_tokens ? ceilings.run_tokens : "不设上限")));
  }

  /* ---- 时间线 ---- */
  function evCard(e) {
    var node = el("span", "ev", describe(e));
    if (e.type === "model.called" || e.type === "model.failed") node.className += " model";
    if (e.type === "gate.checked") node.className += " gate";
    if (e.type === "route") node.className += " route";
    if (e.type === "artifact.written") node.className += " artifact";
    if (e.type === "run.finished") node.className += " finished";
    node.addEventListener("click", function () { showDetail(e); });
    return node;
  }

  function describe(e) {
    switch (e.type) {
      case "run.started": return "▶ 开始（" + (e.data.mode || "") + "）";
      case "artifact.written": return e.data.key + " v" + e.data.version;
      case "model.called": return e.actor + " ← " + (e.data.model || "");
      case "model.failed": return e.actor + " 模型失败";
      case "gate.checked": return "闸门 " + (STAGE_NAME[e.data.gate] || e.data.gate)
        + (e.data.findings ? "：发现 " + e.data.findings + " 个问题" : "：通过");
      case "route": return "⤺ 重跑 " + (STAGE_NAME[e.data.to] || e.data.to) + "（" + (e.data.why || "") + "）";
      case "budget.exceeded": return "⚠ 预算超限：" + (e.data.scope || "");
      case "run.finished": return (e.data.status === "delivered" ? "✔ 交付" : "✖ 停止：" + outcomeText(e.data.reason));
      default: return e.type;
    }
  }

  function renderTimeline() {
    var lanes = document.getElementById("lanes");
    lanes.textContent = "";
    var order = [];
    var byActor = {};
    for (var i = 0; i < revealed && i < allEvents.length; i++) {
      var e = allEvents[i];
      var who = e.actor || "system";
      if (!byActor[who]) { byActor[who] = []; order.push(who); }
      byActor[who].push(e);
    }
    order.forEach(function (who) {
      var lane = el("div", "lane");
      lane.appendChild(el("div", "who", who));
      var cards = el("div", "cards");
      byActor[who].forEach(function (e) { cards.appendChild(evCard(e)); });
      lane.appendChild(cards);
      lanes.appendChild(lane);
    });
    if (!order.length) lanes.appendChild(el("div", "muted", "（按下播放，事件会按发生顺序出现）"));
  }

  function showDetail(e) {
    var body = document.getElementById("detail-body");
    body.textContent = "";
    body.appendChild(el("h2", "", "#" + e.seq + " " + (e.step || e.actor) + " · " + e.type));
    if (e.type === "model.called") {
      body.appendChild(el("div", "", "模型 " + (e.data.model || "") + "；"
        + "输入 " + e.data.usage.input_tokens + " + 输出 " + e.data.usage.output_tokens + " token；"
        + (e.data.cost === null || e.data.cost === undefined ? "未定价" : "成本 " + num(e.data.cost))));
      body.appendChild(el("h2", "", "提示词（原样）"));
      var pre = el("pre", "", e.data.prompt);
      body.appendChild(pre);
      body.appendChild(el("h2", "", "回复（契约校验后的输出）"));
      body.appendChild(el("pre", "", JSON.stringify(e.data.output, null, 2)));
    } else if (e.type === "gate.checked") {
      body.appendChild(el("div", "", "闸门 " + (STAGE_NAME[e.data.gate] || e.data.gate)
        + "：发现 " + e.data.findings + " 个问题。"));
      var detail = e.data.detail;
      if (detail && detail.length) {
        var list = el("ul");
        detail.forEach(function (f) { list.appendChild(el("li", "", "[" + f.check + "] " + f.subject + "：" + f.message)); });
        body.appendChild(list);
      } else if (typeof detail === "string") {
        body.appendChild(el("div", "muted", detail));
      }
    } else if (e.type === "artifact.written") {
      body.appendChild(el("pre", "", JSON.stringify(e.data.value, null, 2)));
    } else {
      body.appendChild(el("pre", "", JSON.stringify(e.data, null, 2)));
    }
    document.getElementById("detail").style.display = "block";
  }

  /* ---- 播放 ---- */
  function renderAll() {
    renderHeader(); renderPipeline(); renderResult(); renderChart();
    renderEvidence(); renderUsage(); renderTimeline();
    var slider = document.getElementById("slider");
    slider.value = allEvents.length ? Math.round(100 * revealed / allEvents.length) : 0;
    document.getElementById("progress-text").textContent = revealed + " / " + allEvents.length;
  }

  function step() {
    if (revealed < allEvents.length) { revealed += 1; renderAll(); }
    if (revealed >= allEvents.length) stop();
  }

  function play() {
    if (revealed >= allEvents.length) revealed = 0;
    playing = true;
    document.getElementById("btn-play").textContent = "⏸ 暂停";
    schedule();
  }

  function schedule() {
    if (timer) { clearTimeout(timer); timer = null; }
    if (!playing || speed === 0) return;
    timer = setTimeout(function () { step(); if (playing) schedule(); }, 900 / speed);
  }

  function stop() {
    playing = false;
    document.getElementById("btn-play").textContent = "▶ 播放";
    if (timer) { clearTimeout(timer); timer = null; }
  }

  document.getElementById("btn-play").addEventListener("click", function () { playing ? stop() : play(); });
  document.getElementById("btn-step").addEventListener("click", function () { stop(); step(); });
  Array.prototype.forEach.call(document.querySelectorAll("#speed-box button"), function (b) {
    b.addEventListener("click", function () {
      speed = Number(b.getAttribute("data-speed"));
      Array.prototype.forEach.call(document.querySelectorAll("#speed-box button"), function (o) { o.className = ""; });
      b.className = "on";
      if (speed === 0) { stop(); revealed = allEvents.length; renderAll(); }
      else if (playing) schedule();
    });
  });
  document.getElementById("slider").addEventListener("input", function (ev) {
    stop();
    revealed = Math.round(allEvents.length * Number(ev.target.value) / 100);
    renderAll();
  });
  document.getElementById("detail-close").addEventListener("click", function () {
    document.getElementById("detail").style.display = "none";
  });
  document.getElementById("detail").addEventListener("click", function (ev) {
    if (ev.target.id === "detail") document.getElementById("detail").style.display = "none";
  });

  /* ---- 取事件：静态内嵌，或实时事件流 ---- */
  function boot() {
    var raw = document.getElementById("embedded").textContent.trim();
    if (raw !== "null") {
      var parsed = JSON.parse(raw);
      allEvents = parsed.events;
      bars = parsed.bars;
      revealed = allEvents.length;            // 静态页面默认整段已就绪，可用播放条重放
      document.getElementById("runlist").style.display = "none";   // 过去的运行只在实时模式有意义
      renderAll();
      return;
    }
    /* 实时模式：事件流。浏览器断线重连时自己带上 Last-Event-ID，收尾消息 event: end。 */
    var params = new URLSearchParams(window.location.search);
    var runId = params.get("run") || "";
    document.getElementById("live").style.display = "block";
    fetch("/api/meta").then(function (r) { return r.json(); }).then(function (meta) {
      var select = document.getElementById("f-scenario");
      var blank = document.createElement("option");
      blank.value = ""; blank.textContent = "（不用场景）";
      select.appendChild(blank);
      meta.scenarios.forEach(function (s) {
        var option = document.createElement("option");
        option.value = s.name;
        option.textContent = s.name + "（" + s.ticker + " @ " + s.as_of + "）";
        select.appendChild(option);
      });
      document.getElementById("f-judges").value = String(meta.defaults.judges);
      document.getElementById("f-rounds").value = meta.defaults.debate_rounds;
      if (meta.mode !== "model") {
        document.getElementById("live-notice").textContent =
          "没有可用的真实模型（原因见下）。可以选一个离线场景；不带场景的运行会在需要模型时以 REVIEW 结束。";
      }
      renderRunList();
    });
    document.getElementById("run-form").addEventListener("submit", function (ev) {
      ev.preventDefault();
      var notice = document.getElementById("live-notice");
      notice.textContent = "";
      var body = {
        ticker: document.getElementById("f-ticker").value.trim(),
        as_of: document.getElementById("f-asof").value.trim(),
        scenario: document.getElementById("f-scenario").value,
        judges: document.getElementById("f-judges").value === "true",
        debate_rounds: Number(document.getElementById("f-rounds").value)
      };
      fetch("/api/runs", { method: "POST", headers: { "Content-Type": "application/json" },
                           body: JSON.stringify(body) }).then(function (r) {
        return r.json().then(function (data) { return { ok: r.status === 202, data: data }; });
      }).then(function (result) {
        if (!result.ok) {
          notice.textContent = "服务器拒绝了这次启动：" + (result.data.error || "未知原因");
          return;
        }
        window.location.search = "?run=" + encodeURIComponent(result.data.run_id);
      });
    });
    renderAll();
    if (runId) {
      var source = new EventSource("/api/runs/" + encodeURIComponent(runId) + "/events");
      source.addEventListener("journal", function (msg) {
        allEvents.push(JSON.parse(msg.data));
        if (!playing) { revealed = allEvents.length; renderAll(); }
      });
      source.addEventListener("end", function () {
        source.close();
        revealed = allEvents.length;
        renderAll();
        fetch("/api/runs/" + encodeURIComponent(runId) + "/bars")
          .then(function (r) { return r.json(); })
          .then(function (data) {
            if (data.bars && data.bars.length) { bars = data.bars; renderAll(); }
          });
      });
    }
  }

  function renderRunList() {
    var body = document.getElementById("runlist-body");
    fetch("/api/runs").then(function (r) { return r.json(); }).then(function (data) {
      body.textContent = "";
      if (!data.runs.length) { body.textContent = "（还没有运行）"; return; }
      var table = document.createElement("table");
      var head = document.createElement("tr");
      ["时间", "代码", "分析日", "结果", "原因", ""].forEach(function (h) {
        var th = document.createElement("th"); th.textContent = h; head.appendChild(th);
      });
      table.appendChild(head);
      data.runs.forEach(function (r) {
        var tr = document.createElement("tr");
        [r.run_id.slice(0, 15), r.ticker, r.as_of, r.status, r.reason].forEach(function (v) {
          var td = document.createElement("td"); td.textContent = v; tr.appendChild(td);
        });
        var link = document.createElement("td");
        var a = document.createElement("a");
        a.textContent = "查看";
        a.addEventListener("click", function () {
          window.location.search = "?run=" + encodeURIComponent(r.run_id);
        });
        link.appendChild(a); tr.appendChild(link);
        table.appendChild(tr);
      });
      body.appendChild(table);
    });
  }

  boot();
})();
</script>
</body>
</html>
