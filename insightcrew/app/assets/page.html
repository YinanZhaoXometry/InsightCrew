<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self'; img-src data:">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>InsightCrew</title>
<style>
  :root {
    --ink:#18202c; --soft:#4a5565; --muted:#7a8496; --line:#e2e7ee; --bg:#f4f6f9; --card:#ffffff; --lane:#f7f9fc;
    --accent:#3451d1; --accent-bg:#eaeefc; --good:#18794e; --good-bg:#e6f4ec; --bad:#b42318; --bad-bg:#fdecea;
    --warn:#96600c; --warn-bg:#fdf3df; --code:#0f7b8a; --code-bg:#e4f4f6; --radius:10px;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing:border-box; }
  body { margin:0; padding:28px 24px 64px; background:var(--bg); color:var(--ink);
         font:14px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif; }
  .wrap { max-width:1180px; margin:0 auto; }
  h1 { font-size:22px; line-height:1.3; margin:0; letter-spacing:.2px; }
  h2 { font-size:14px; margin:0 0 10px; color:var(--soft); font-weight:600; letter-spacing:.3px; }
  h3 { font-size:13px; margin:16px 0 6px; color:var(--soft); font-weight:600; }
  [hidden] { display:none !important; }
  .muted { color:var(--muted); }
  .mono { font-family:var(--mono); font-size:12.5px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px; }
  section { margin-top:16px; }
  button { font:inherit; color:inherit; }

  /* 页头 */
  .top { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; }
  .brand { font-size:12px; font-weight:700; letter-spacing:1.6px; color:var(--accent); text-transform:uppercase; }
  #subtitle { color:var(--muted); font-size:13px; margin-top:2px; }
  .badge { flex:none; padding:5px 12px; border-radius:999px; font-size:12px; font-weight:600; white-space:nowrap;
           border:1px solid var(--line); background:var(--card); color:var(--soft); }
  .badge.scripted { background:var(--warn-bg); border-color:#edd9ac; color:var(--warn); }
  .badge.model { background:var(--accent-bg); border-color:#c9d3f7; color:var(--accent); }
  .badge.replay { background:var(--code-bg); border-color:#bfe1e6; color:var(--code); }
  .disclaimer { margin:10px 0 0; font-size:12px; color:var(--muted); }
  .banner { margin-top:16px; padding:10px 14px; border-radius:var(--radius); background:var(--bad-bg);
            border:1px solid #f4c7c1; color:var(--bad); }

  /* 发起运行（实时模式） */
  #form { display:flex; flex-wrap:wrap; gap:12px; align-items:flex-end; }
  #form label { display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--muted); }
  #form label.inline { flex-direction:row; align-items:center; gap:6px; padding-bottom:7px; color:var(--soft); }
  #form input, #form select { font:inherit; color:var(--ink); padding:6px 9px; border:1px solid var(--line);
                              border-radius:7px; background:#fff; min-height:34px; }
  #form input:disabled, #form select:disabled { background:var(--lane); color:var(--muted); }
  #f-scenario { min-width:230px; } #f-ticker { width:130px; } #f-rounds { width:70px; }
  .primary { padding:7px 20px; min-height:34px; border-radius:7px; border:1px solid var(--accent);
             background:var(--accent); color:#fff; font-weight:600; cursor:pointer; }
  .primary:hover { filter:brightness(1.08); }
  .linkish { border:0; background:none; padding:0; color:var(--accent); cursor:pointer; text-decoration:underline; }
  .note { margin:10px 0 0; font-size:12.5px; color:var(--soft); }
  .error { margin:10px 0 0; font-size:12.5px; color:var(--bad); }
  details { margin-top:12px; } summary { cursor:pointer; color:var(--soft); font-size:13px; }
  #history-body { max-height:340px; overflow:auto; }

  /* 表格 */
  table { border-collapse:collapse; width:100%; font-size:13px; }
  th, td { text-align:left; padding:6px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { font-weight:600; color:var(--soft); background:var(--lane); white-space:nowrap; }
  tr:last-child td { border-bottom:0; }
  td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
  tr.total td { font-weight:600; background:var(--lane); }
  .pass { color:var(--good); font-weight:600; } .fail { color:var(--bad); font-weight:600; } .na { color:var(--muted); }

  /* 流水线 */
  #pipeline { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .stage { display:flex; align-items:center; gap:6px; padding:6px 12px; border-radius:8px; font-size:12.5px;
           border:1px solid var(--line); background:var(--card); color:var(--muted); }
  .stage .kind { font-size:10px; padding:0 5px; border-radius:4px; border:1px solid currentColor; opacity:.75; }
  .stage.done { background:var(--good-bg); border-color:#bfe0cd; color:var(--good); }
  .stage.running { background:var(--accent-bg); border-color:var(--accent); color:var(--accent); font-weight:600; }
  .stage.revised { background:var(--warn-bg); border-color:#edd9ac; color:var(--warn); }
  .stage.halted { background:var(--bad-bg); border-color:#f4c7c1; color:var(--bad); font-weight:600; }
  .arrow { color:var(--line); font-size:12px; }

  /* 回放控制 */
  #playbar { display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:10px 14px; }
  .ctl { padding:5px 12px; min-height:30px; border:1px solid var(--line); background:#fff; border-radius:7px; cursor:pointer; }
  .ctl:hover { border-color:var(--accent); }
  .ctl.on { background:var(--accent-bg); border-color:var(--accent); color:var(--accent); font-weight:600; }
  .speed { display:flex; gap:4px; align-items:center; }
  #slider { flex:1; min-width:160px; accent-color:var(--accent); }
  #progress { font-variant-numeric:tabular-nums; min-width:64px; text-align:right; }

  /* 结果与价格图 */
  .two { display:grid; grid-template-columns:minmax(0, 5fr) minmax(0, 6fr); gap:16px; }
  @media (max-width:860px) { .two { grid-template-columns:1fr; } }
  .verdict { font-size:24px; font-weight:700; line-height:1.25; }
  .verdict.review { color:var(--bad); }
  .verdict small { font-size:13px; font-weight:500; color:var(--muted); margin-left:8px; }
  .levels { display:grid; grid-template-columns:repeat(auto-fit, minmax(96px, 1fr)); gap:8px; margin:14px 0; }
  .level { border:1px solid var(--line); border-radius:8px; padding:8px 10px; background:var(--lane); }
  .level b { display:block; font-size:16px; font-variant-numeric:tabular-nums; }
  .level span { font-size:11.5px; color:var(--muted); }
  .confidence { margin:12px 0 0; padding:0; list-style:none; font-size:13px; }
  .confidence li { padding:6px 0; border-top:1px solid var(--line); display:grid; grid-template-columns:84px 1fr; gap:8px; }
  .confidence b { color:var(--soft); }
  svg { display:block; width:100%; height:auto; }

  /* 时间线：每个角色一条泳道，角色的每次出场一栏，从左到右就是发生的顺序 */
  #lanes { overflow:auto; max-height:560px; border:1px solid var(--line); border-radius:var(--radius); background:var(--card); }
  .grid { display:grid; grid-template-columns:136px; grid-auto-columns:150px; gap:4px; padding:10px; min-width:max-content; }
  .cell { display:flex; flex-direction:column; gap:3px; min-width:0; z-index:1; padding:3px 0; }
  .lane-bg { grid-column:1 / -1; background:var(--lane); border-radius:6px; }
  .lane-name { grid-column:1; position:sticky; left:0; z-index:2; display:flex; align-items:center; gap:6px;
               padding:4px 8px; font-size:12px; color:var(--soft); background:var(--lane); border-radius:6px; min-height:42px; }
  .tag { font-size:10px; padding:0 5px; border-radius:4px; border:1px solid; flex:none; }
  .tag.model { color:var(--accent); border-color:#c9d3f7; background:var(--accent-bg); }
  .tag.code { color:var(--code); border-color:#bfe1e6; background:var(--code-bg); }
  .tick { font-size:10px; color:var(--muted); text-align:center; font-variant-numeric:tabular-nums;
          position:sticky; top:0; z-index:3; background:var(--card); padding:2px 0; }
  .ev { text-align:left; padding:3px 8px; border-radius:6px; border:1px solid var(--line); background:#fff;
        cursor:pointer; font-size:11.5px; line-height:1.35; overflow:hidden; width:100%; }
  .ev b { display:block; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ev span { display:block; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ev:hover, .ev.selected { border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-bg); }
  .ev.model { background:var(--accent-bg); border-color:#c9d3f7; }
  .ev.good { background:var(--good-bg); border-color:#bfe0cd; }
  .ev.bad { background:var(--bad-bg); border-color:#f4c7c1; }
  .ev.route, .ev.return { background:var(--warn-bg); border-color:#edd9ac; }
  .ev.return { border-style:dashed; }
  .ev.artifact { background:#fff; display:flex; gap:6px; align-items:baseline; }   /* 产物只占一行：键名 + 版本 */
  .ev.artifact b { flex:1; min-width:0; font-weight:500; } .ev.artifact span { flex:none; }
  .ev.old b { text-decoration:line-through; color:var(--muted); }
  .ev.latest { animation:arrive .5s ease-out; }
  @keyframes arrive { from { transform:scale(.9); opacity:.2; } to { transform:none; opacity:1; } }

  /* 详情抽屉 */
  #detail { position:fixed; top:0; right:0; bottom:0; width:min(600px, 94vw); z-index:20; overflow:auto;
            background:var(--card); border-left:1px solid var(--line); box-shadow:-12px 0 32px rgba(24,32,44,.12);
            padding:18px 20px 40px; }
  #detail .close { float:right; }
  pre { margin:0; padding:10px 12px; background:var(--lane); border:1px solid var(--line); border-radius:8px;
        font:12px/1.55 var(--mono); white-space:pre-wrap; word-break:break-word; max-height:340px; overflow:auto; }
  .kv { display:grid; grid-template-columns:max-content 1fr; gap:4px 14px; font-size:13px; margin:8px 0; }
  .kv dt { color:var(--muted); } .kv dd { margin:0; }
  .findings { margin:6px 0; padding-left:18px; } .findings li { margin:4px 0; }
  .signals { margin:6px 0; padding-left:18px; } .signals li { margin:3px 0; }
  .signals .mono { margin-right:4px; }

  .meter { height:8px; border-radius:999px; background:var(--lane); border:1px solid var(--line); overflow:hidden; margin-top:6px; }
  .meter i { display:block; height:100%; background:var(--accent); }
  .meter.over i { background:var(--bad); }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="brand">InsightCrew</div>
      <h1 id="title">多智能体交易辅助系统</h1>
      <div id="subtitle">数字由代码计算并复算，方案由代码按规则审计，模型只负责判断。</div>
    </div>
    <span class="badge" id="badge" hidden></span>
  </header>
  <p class="disclaimer">本页面由课程项目自动生成，不构成投资建议；系统不执行、不路由、也不模拟任何订单。</p>
  <div class="banner" id="banner" hidden></div>

  <section class="card" id="launch" hidden>
    <h2>发起一次运行</h2>
    <form id="form">
      <label>离线场景 <select id="f-scenario"></select></label>
      <label>代码 <input id="f-ticker" maxlength="32" placeholder="ACME / 0700.HK" list="tickers" autocomplete="off"></label>
      <datalist id="tickers"></datalist>
      <label>分析日 <input id="f-date" type="date"></label>
      <label class="inline"><input id="f-judges" type="checkbox"> 模型评审</label>
      <label>辩论轮数 <input id="f-rounds" type="number" min="0" max="10"></label>
      <button class="primary" type="submit">开始</button>
    </form>
    <p class="note" id="mode-note"></p>
    <p class="note" id="scenario-note" hidden></p>
    <p class="error" id="form-error" hidden></p>
    <details id="history"><summary>过去的运行</summary><div id="history-body" class="muted">（加载中）</div></details>
  </section>

  <main id="run" hidden>
    <section id="pipeline" aria-label="流水线"></section>

    <section class="card" id="playbar" aria-label="回放控制">
      <button class="ctl" id="btn-play" type="button">播放</button>
      <button class="ctl" id="btn-step" type="button">单步</button>
      <span class="speed" id="speeds"><span class="muted">速度</span>
        <button class="ctl" type="button" data-speed="slow">慢</button>
        <button class="ctl" type="button" data-speed="normal">正常</button>
        <button class="ctl" type="button" data-speed="fast">快</button>
        <button class="ctl" type="button" data-speed="instant">瞬间</button>
      </span>
      <input id="slider" type="range" min="0" max="0" value="0" aria-label="回放位置">
      <span class="muted" id="progress"></span>
    </section>

    <section class="two">
      <div class="card" id="result"></div>
      <div class="card" id="chart"></div>
    </section>

    <section>
      <h2>过程记录（被否决的方案不是结论）</h2>
      <div id="lanes"></div>
      <p class="note">每条事件一张卡片，一栏是一个角色的一次出场，从左到右是发生的顺序；点卡片看它的内容。带删除线的是后来被新版本取代的产物。</p>
    </section>

    <section class="card" id="evidence"></section>
    <section class="card" id="usage"></section>
  </main>
</div>

<aside id="detail" hidden aria-label="事件详情"></aside>

<script type="application/json" id="embedded">null</script>
<script>
/* 运行页面。它的全部输入是一串事件：静态模式下嵌在 #embedded 里，实时模式下来自本地服务的事件流。
   页面自己折叠黑板，只做展示。它显示的每个价格、价位、比率与规则数值都是事件里现成的值；
   唯一的求和是模型用量（token 与调用成本）的累计。运行数据一律作为文本插入。 */
(() => {
"use strict";

const SVG_NS = "http://www.w3.org/2000/svg";
const STAGES = [["intake", "范围闸门", "code"], ["ledger", "事实账本", "code"], ["technical", "技术分析", "model"],
                ["fundamentals", "基本面分析", "model"], ["disclosures", "公告分析", "model"],
                ["debate", "多空辩论", "model"], ["manager", "研究主管", "model"], ["trader", "交易员", "model"],
                ["audit", "审计", "code"], ["judges", "评审", "model"], ["report", "报告", "code"]];
const STAGE_NAME = Object.fromEntries(STAGES.map(([key, name]) => [key, name]));
STAGE_NAME.evidence = "证据";
const STAGE_ORDER = STAGES.map(([key]) => key);
const CHANNEL_STAGES = { fundamentals: "fundamentals/status", disclosures: "disclosures/status" };
const ACTOR_STAGE = { intake: "intake", ledger: "ledger", evidence: "ledger", technical: "technical",
                      fundamentals: "fundamentals", disclosures: "disclosures", bull: "debate", bear: "debate",
                      manager: "manager", trader: "trader", audit: "audit" };
const STAGE_LANE = { technical: "technical", fundamentals: "fundamentals", disclosures: "disclosures",
                     debate: "bull", manager: "manager", trader: "trader" };
const LANES = [["app", "系统", "code"], ["intake", "范围闸门", "code"], ["ledger", "事实账本", "code"],
               ["evidence", "证据", "code"],
               ["technical", "技术分析师", "model"], ["fundamentals", "基本面分析师", "model"],
               ["disclosures", "公告分析师", "model"],
               ["bull", "多方研究员", "model"], ["bear", "空方研究员", "model"],
               ["manager", "研究主管", "model"], ["trader", "交易员", "model"], ["audit", "审计", "code"],
               ["judge.evidence", "证据评审", "model"], ["judge.conservative", "保守评审", "model"],
               ["judge.aggressive", "进取评审", "model"], ["flow", "流程", "code"]];
const GROUP_NAME = { technical: "技术分析师", fundamentals: "基本面分析师", disclosures: "公告分析师",
                     bull: "多方研究员", bear: "空方研究员", manager: "研究主管",
                     trader: "交易员", judge: "评审（三个视角）" };
const CHANNEL_STATE = { available: "可用", empty: "窗口内没有公告", unavailable: "不可用" };
const DIRECTION_TEXT = { positive: "正面", negative: "负面", neutral: "中性" };
const STANCE_TEXT = { positive: "正面", mixed: "混合", neutral: "中性", negative: "负面" };
const JUDGES = [["evidence", "证据评审"], ["conservative", "保守评审"], ["aggressive", "进取评审"]];
const REASON = {
  invalid_ticker: "代码格式不正确", unknown_ticker: "代码不在数据集里", no_data: "该日期之前没有已收盘的行情",
  future_date: "分析日期晚于今天", stale_data: "数据过旧", insufficient_history: "历史数据不足",
  source_unavailable: "行情数据源不可用", ledger_inconsistent: "两条计算路径的结果不一致",
  malformed_output: "模型输出两次都不合契约", stagnation: "同样的问题连续两次未被修正",
  audit_failed: "多次打回后审计仍未通过", contested: "评审多数反对，未达成共识",
  budget_exhausted: "token 预算已用尽", time_exhausted: "时间预算已用尽",
  calls_exhausted: "模型请求次数已用尽", model_unavailable: "模型不可用" };
const STATUS_TEXT = { delivered: "交付", review: "REVIEW", running: "进行中", incomplete: "未正常结束" };
const MODE_TEXT = { scripted: "脚本化", model: "真实模型", replay: "回放" };
const PACE = { slow: 1500, normal: 700, fast: 220 };

const state = {
  live: false,        // 实时模式（由本地服务提供页面）还是静态模式（事件嵌在页面里）
  meta: null,         // 实时模式下表单需要的信息
  runId: "",
  events: [],         // 收到的全部事件，按 seq
  shown: 0,           // 已揭示的条数：回放的位置
  ended: true,        // 事件是否已经到齐
  error: null,        // 事件流以 error 收尾时的说明
  bars: null, currency: "", barsAsked: false,
  playing: false, speed: "normal", timer: null,
  source: null,
  selected: 0,        // 详情里打开的事件的 seq
  follow: true,       // 时间线是否跟着最新一条滚动
};

/* ---------- 小工具 ---------- */

const $ = (id) => document.getElementById(id);

function el(tag, props, ...kids) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(props || {})) {
    if (value === null || value === undefined || value === false) continue;
    if (key === "class") node.className = value;
    else if (key === "on") for (const [name, fn] of Object.entries(value)) node.addEventListener(name, fn);
    else node.setAttribute(key, value === true ? "" : String(value));
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid === null || kid === undefined || kid === false) continue;
    node.append(kid instanceof Node ? kid : String(kid));       // 字符串成为文本节点，不会被当作标记
  }
  return node;
}

function svg(tag, attrs, text) {
  const node = document.createElementNS(SVG_NS, tag);
  for (const [key, value] of Object.entries(attrs || {})) node.setAttribute(key, String(value));
  if (text !== undefined) node.textContent = String(text);
  return node;
}

function fill(node, ...kids) {
  node.replaceChildren(...kids.flat(Infinity).filter((kid) => kid !== null && kid !== undefined && kid !== false));
}

function num(value, places = 4) {                 // 展示格式：至多 places 位小数，去掉多余的零
  if (value === null || value === undefined) return "—";
  const text = Number(value).toFixed(places).replace(/\.?0+$/, "");
  return text === "" || text === "-" || text === "-0" ? "0" : text;
}
const count = (value) => Number(value || 0).toLocaleString("en-US");
const reasonText = (reason) => REASON[reason] || reason || "";
const withUnit = (value, unit) => value === undefined || value === null ? "—"
  : num(value) + (unit === "%" ? "%" : unit ? " " + unit : "");

function table(header, rows, numeric = []) {
  const cell = (tag, value, i) => el(tag, { class: numeric.includes(i) ? "num" : null }, value);
  return el("table", null,
    el("thead", null, el("tr", null, header.map((h, i) => cell("th", h, i)))),
    el("tbody", null, rows.map((row) => el("tr", { class: row.cls || null }, row.map((v, i) => cell("td", v, i))))));
}

/* ---------- 从事件得到要显示的东西 ---------- */

const view = () => state.events.slice(0, state.shown);
const startedData = () => (state.events[0] && state.events[0].type === "run.started" ? state.events[0].data : null);

function fold(events) {                           // 黑板：每个键的最新值
  const board = {};
  for (const e of events) if (e.type === "artifact.written") board[e.data.key] = e.data.value;
  return board;
}

function stageOf(e) {
  if (e.type === "gate.checked") return e.data.gate;
  if (!["model.called", "model.failed", "budget.exceeded", "artifact.written"].includes(e.type)) return null;
  const actor = e.actor || "";
  if (actor.startsWith("judge.")) return "judges";
  if (e.type === "artifact.written" && e.data.key.startsWith("judges/")) return "judges";
  if (e.type === "artifact.written" && e.data.key.startsWith("run/")) return "report";
  return ACTOR_STAGE[actor] || null;
}

function pipeline(events) {
  /* 每一段的状态。被打回时，目标段与它之后的各段回到"未开始"，目标段记一次返工。
     current 是正在进行的那一段：闸门通过后轮到下一段，被打回后轮到被点名的那一段。 */
  const status = {}, redo = {};
  let last = null, current = null, finished = null;
  for (const e of events) {
    if (e.type === "route") {
      for (const stage of STAGE_ORDER.slice(STAGE_ORDER.indexOf(e.data.to))) delete status[stage];
      redo[e.data.to] = (redo[e.data.to] || 0) + 1;
      last = null; current = e.data.to;
    } else if (e.type === "run.finished") {
      finished = e;
    } else {
      const stage = stageOf(e);
      if (!stage) continue;
      if (stage !== "report") last = stage;
      const stopped = e.type === "model.failed" || e.type === "budget.exceeded"
        || (e.type === "gate.checked" && e.data.findings > 0)
        || (e.type === "model.called" && e.data.output === null && stage !== "judges");
      status[stage] = stopped ? "halted" : "done";
      const passed = e.type === "gate.checked" && !stopped;
      current = stopped ? null : passed ? STAGE_ORDER[STAGE_ORDER.indexOf(stage) + 1] || null : stage;
    }
  }
  if (finished) {
    status.report = "done";
    if (finished.data.status !== "delivered" && last && status[last] === "done") status[last] = "halted";
  } else if (current) {
    status[current] = "running";
  }
  return { status, redo };
}

function usage(events) {                          // 页面唯一的求和：模型用量的累计
  const groups = new Map();
  const total = { calls: 0, requests: 0, input: 0, output: 0, cost: 0, unpriced: 0 };
  for (const e of events) {
    if (e.type !== "model.called") continue;
    const key = e.actor.split(".")[0];
    if (!groups.has(key)) groups.set(key, { calls: 0, requests: 0, input: 0, output: 0, cost: 0, unpriced: 0 });
    for (const row of [groups.get(key), total]) {
      row.calls += 1;
      row.requests += e.data.usage.requests;
      row.input += e.data.usage.input_tokens;
      row.output += e.data.usage.output_tokens;
      if (e.data.cost === null || e.data.cost === undefined) row.unpriced += 1; else row.cost += e.data.cost;
    }
  }
  return { groups, total };
}

const costText = (row) => row.unpriced === row.calls ? "未定价"
  : num(row.cost, 6) + (row.unpriced ? "（另有未定价）" : "");

/* ---------- 流水线 ---------- */

function renderPipeline(events) {
  const { status, redo } = pipeline(events);
  const board = fold(events);
  const chips = [];
  let shown = 0;
  STAGES.forEach(([key, name, kind]) => {
    if (CHANNEL_STAGES[key] && !board[CHANNEL_STAGES[key]]) return;   // 这次运行没开这条通道
    let cls = status[key] || "idle";
    if (cls === "done" && redo[key]) cls = "revised";
    if (shown++) chips.push(el("span", { class: "arrow" }, "→"));
    chips.push(el("span", { class: "stage " + cls, title: kind === "model" ? "由模型完成" : "由代码完成" },
      name, el("span", { class: "kind" }, kind === "model" ? "模型" : "代码"),
      redo[key] ? "↺" + redo[key] : null));
  });
  fill($("pipeline"), chips);
}

/* ---------- 结果 ---------- */

function judgmentText(judgment) {
  if (!judgment) return "—";
  if (judgment.startsWith("accepted")) return "评审接受（" + judgment.slice("accepted".length).trim() + "）。评审只能否决，不能证明方案正确。";
  if (judgment === "contested") return "评审相持：多数评审反对。";
  if (judgment.startsWith("not reviewed")) {
    const why = judgment.includes(":") ? judgment.slice(judgment.indexOf(":") + 1).trim() : "";
    return "未经评审" + (why ? "（" + (why === "judges disabled" ? "评审已关闭" : reasonText(why)) + "）" : "") + "。";
  }
  return judgment;
}

function confidence(outcome) {
  return el("ul", { class: "confidence" },
    el("li", null, el("b", null, "事实与规则"), outcome.facts_and_rules === "verified"
      ? "已核验：数字由代码计算并复算，规则由代码逐条检查。" : "未核验：审计没有确认当前版本。"),
    el("li", null, el("b", null, "模型判断"), judgmentText(outcome.judgment)));
}

function renderResult(events) {
  const board = fold(events), outcome = board["run/outcome"], box = $("result");
  if (!outcome) {
    fill(box, el("h2", null, "结果"),
      el("div", { class: "muted" }, state.ended && state.shown >= state.events.length
        ? "这次运行没有留下结果。" : "运行尚未结束。结果在最后一步写出。"));
    return;
  }
  if (outcome.status !== "delivered") {         // REVIEW：这一块不出现任何评级与价位
    const kids = [el("h2", null, "结果"), el("div", { class: "verdict review" }, "REVIEW：未给出评级"),
      el("p", null, "原因：" + reasonText(outcome.reason) + "。")];
    const started = startedData();
    if (outcome.reason === "model_unavailable" && started && started.mode === "scripted") {
      kids.push(el("p", { class: "muted" }, "没有可用的真实模型；脚本化模型只能回答场景里写好的内容。"
        + (state.meta ? "可以选的离线场景：" + state.meta.scenarios.map((s) => s.name).join("、") + "。" : "")));
    }
    kids.push(confidence(outcome));
    fill(box, kids);
    return;
  }
  const thesis = board["manager/thesis"] || {}, proposal = board["trader/proposal"] || {};
  const currency = (board["ledger/instrument"] || {}).currency || "";
  const level = (label, value) => el("div", { class: "level" }, el("b", null, value), el("span", null, label));
  fill(box, el("h2", null, "结果"),
    el("div", { class: "verdict" }, "评级 " + thesis.rating + " · 操作 " + proposal.action, el("small", null, currency)),
    el("div", { class: "levels" },
      level("入场价", num(proposal.entry)), level("止损价", num(proposal.stop)), level("目标价", num(proposal.target)),
      level("仓位（占权益）", num(proposal.size_pct) + "%"), level("持有（交易日）", proposal.horizon_days)),
    proposal.rationale ? el("p", { class: "muted" }, "方案说明：" + proposal.rationale) : null,
    confidence(outcome));
}

/* ---------- 价格图 ---------- */

function renderChart(events) {
  const box = $("chart"), bars = state.bars;
  if (!bars || !bars.length) {
    const why = state.live && !state.ended ? "准入通过后加载。"
      : "这次运行没有通过准入，或数据集里读不到这个代码，所以没有价格序列。";
    fill(box, el("h2", null, "收盘价（截至分析日）"), el("div", { class: "muted" }, why));
    return;
  }
  const board = fold(events), outcome = board["run/outcome"];
  const proposal = outcome && outcome.status === "delivered" ? board["trader/proposal"] || {} : {};
  const levels = [["入场", proposal.entry, "#18794e"], ["止损", proposal.stop, "#b42318"], ["目标", proposal.target, "#96600c"]]
    .filter(([, value]) => value !== null && value !== undefined);
  const closes = bars.map((bar) => bar.close);
  const low = Math.min(...closes), high = Math.max(...closes);
  const bottom = Math.min(low, ...levels.map(([, v]) => v)), top = Math.max(high, ...levels.map(([, v]) => v));
  const W = 640, H = 250, L = 52, R = 78, T = 14, B = 26;                 // 以下只是把数值换成画布坐标
  const x = (i) => L + (W - L - R) * i / Math.max(1, closes.length - 1);
  const y = (v) => T + (H - T - B) * (top - v) / ((top - bottom) || 1);
  const chart = svg("svg", { viewBox: "0 0 " + W + " " + H, role: "img", "aria-label": "收盘价走势" });
  for (const value of [high, low]) {
    chart.append(svg("line", { x1: L, x2: W - R, y1: y(value), y2: y(value), stroke: "#e2e7ee" }),
      svg("text", { x: L - 6, y: y(value) + 4, "text-anchor": "end", "font-size": 11, fill: "#7a8496" }, num(value, 2)));
  }
  chart.append(svg("polyline", { fill: "none", stroke: "#3451d1", "stroke-width": 1.6, "stroke-linejoin": "round",
    points: closes.map((c, i) => x(i).toFixed(1) + "," + y(c).toFixed(1)).join(" ") }));
  chart.append(svg("circle", { cx: x(closes.length - 1), cy: y(closes[closes.length - 1]), r: 3, fill: "#3451d1" }));
  const tags = levels.map(([label, value, color]) => ({ label, value, color, at: y(value) })).sort((a, b) => a.at - b.at);
  for (let i = 1; i < tags.length; i++) tags[i].at = Math.max(tags[i].at, tags[i - 1].at + 13);   // 价位挨得近时把标签错开
  for (const tag of tags) {
    chart.append(svg("line", { x1: L, x2: W - R, y1: y(tag.value), y2: y(tag.value), stroke: tag.color, "stroke-dasharray": "5 4" }),
      svg("text", { x: W - R + 6, y: tag.at + 4, "font-size": 11, fill: tag.color }, tag.label + " " + num(tag.value, 2)));
  }
  chart.append(svg("text", { x: L, y: H - 8, "font-size": 11, fill: "#7a8496" }, bars[0].date),
    svg("text", { x: W - R, y: H - 8, "text-anchor": "end", "font-size": 11, fill: "#7a8496" }, bars[bars.length - 1].date));
  const currency = state.currency || (board["ledger/instrument"] || {}).currency || "";
  fill(box, el("h2", null, "收盘价（截至分析日，" + bars.length + " 根" + (currency ? "，" + currency : "") + "）"), chart,
    levels.length ? null : el("p", { class: "note" }, outcome && outcome.status !== "delivered"
      ? "没有交付方案，所以图上没有价位线。" : "方案交付后，图上会画出入场、止损与目标价。"));
}

/* ---------- 时间线 ---------- */

function describe(e) {
  const d = e.data;
  switch (e.type) {
    case "run.started": return ["开始", MODE_TEXT[d.mode] || d.mode, ""];
    case "artifact.written": return [d.key, "v" + d.version, "artifact"];
    case "model.called":
      return [d.output === null ? "输出不合契约" : "模型作答",
              count(d.usage.input_tokens) + "+" + count(d.usage.output_tokens) + " token" + (d.usage.requests > 1 ? " · 重试" : ""),
              d.output === null ? "bad" : "model"];
    case "model.failed": return ["模型调用失败", d.model || "", "bad"];
    case "gate.checked":
      return d.findings ? ["发现 " + d.findings + " 个问题", ((d.detail || [])[0] || {}).check || "", "bad"] : ["通过", "", "good"];
    case "route": return ["⤺ 打回", "从" + (STAGE_NAME[d.to] || d.to) + "重跑", "route"];
    case "budget.exceeded": return ["预算超限", d.scope || "", "bad"];
    case "run.finished":
      return d.status === "delivered" ? ["交付", d.reason === "ok" ? "" : reasonText(d.reason), "good"]
                                      : ["REVIEW", reasonText(d.reason), "bad"];
    default: return [e.type, "", ""];
  }
}

function renderTimeline(events) {
  const holder = $("lanes");
  const known = LANES.map(([key]) => key);
  const present = new Set(state.events.map((e) => e.actor || "app"));
  const lanes = LANES.filter(([key]) => present.has(key))
    .concat([...present].filter((key) => !known.includes(key)).map((key) => [key, key, "code"]));
  const rowOf = Object.fromEntries(lanes.map(([key], i) => [key, i + 2]));
  const newest = {};                              // 每个键最新的版本号：更早的版本画上删除线
  for (const e of events) if (e.type === "artifact.written") newest[e.data.key] = e.data.version;

  const turns = [];                               // 同一个角色连续写下的事件并成一栏：一栏就是它的一次出场
  for (const e of events) {
    const actor = e.actor || "app", last = turns[turns.length - 1];
    if (last && last.actor === actor) last.events.push(e); else turns.push({ actor, events: [e] });
  }
  const latest = state.playing && events.length ? events[events.length - 1].seq : 0;

  const grid = el("div", { class: "grid" });
  const place = (node, row, column) => { node.style.gridRow = String(row); node.style.gridColumn = String(column); return node; };
  lanes.forEach(([key, name, kind]) => {
    const band = el("div", { class: "lane-bg" });
    band.style.gridRow = String(rowOf[key]);
    band.style.gridColumn = "1 / span " + (turns.length + 1);
    grid.append(band, place(el("div", { class: "lane-name" },
      el("span", { class: "tag " + kind }, kind === "model" ? "模型" : "代码"), name), rowOf[key], 1));
  });
  turns.forEach((turn, i) => {
    const column = i + 2, first = turn.events[0].seq, last = turn.events[turn.events.length - 1].seq;
    grid.append(place(el("div", { class: "tick" }, first === last ? "#" + first : "#" + first + "–" + last), 1, column));
    const cell = el("div", { class: "cell" });
    for (const e of turn.events) {
      const [title, sub, kind] = describe(e);
      const old = e.type === "artifact.written" && newest[e.data.key] !== e.data.version;
      cell.append(el("button", { type: "button", title: title + (sub ? " · " + sub : ""),
        class: "ev " + kind + (old ? " old" : "") + (e.seq === state.selected ? " selected" : "")
          + (e.seq === latest ? " latest" : ""),
        on: { click: () => openDetail(e.seq) } }, el("b", null, title), el("span", null, sub)));
      if (e.type === "route" && rowOf[STAGE_LANE[e.data.to]]) {   // 打回画成回到它点名的那一段
        grid.append(place(el("div", { class: "cell" }, el("button", { type: "button", class: "ev return",
          title: e.data.why || "", on: { click: () => openDetail(e.seq) } },
          el("b", null, "↩ 从这里重跑"), el("span", null, e.data.why || ""))), rowOf[STAGE_LANE[e.data.to]], column));
      }
    }
    grid.append(place(cell, rowOf[turn.actor], column));
  });
  const left = holder.scrollLeft, top = holder.scrollTop;
  fill(holder, events.length ? grid : el("div", { class: "muted", style: "padding:14px" }, "还没有事件。按“播放”逐条揭示。"));
  holder.scrollLeft = left; holder.scrollTop = top;
  const cards = holder.querySelectorAll(".cell .ev:not(.return)");
  if (state.follow && cards.length) {              // 跟随：把最新一张卡片移到框的中间。只滚这个框，不动整页
    const box = holder.getBoundingClientRect(), card = cards[cards.length - 1].getBoundingClientRect();
    holder.scrollLeft += card.left + card.width / 2 - (box.left + box.width / 2);
    holder.scrollTop += card.top + card.height / 2 - (box.top + box.height / 2);
  }
}

                delivered ? verdict.critique || "" : ""];
      })));
    if (outcome && !delivered) kids.push(el("p", { class: "note" }, "没有交付结论，评审意见的正文不在这里展示；点过程记录里评审的卡片可以看到。"));
  }
  if (kids.length === 1) kids.push(el("div", { class: "muted" }, "还没有证据。"));
  fill($("evidence"), kids);
}

/* ---------- 用量 ---------- */

function renderUsage(events) {
  const { groups, total } = usage(events), kids = [el("h2", null, "用量与成本")];
  if (!total.calls) { fill($("usage"), kids, el("div", { class: "muted" }, "还没有模型调用。")); return; }
  const ceilings = (startedData() || {}).ceilings || {}, roleCaps = ceilings.roles || {};
  const rows = [...groups].map(([key, row]) => [GROUP_NAME[key] || key, count(row.calls), count(row.requests),
    count(row.input), count(row.output), count(row.input + row.output),
    roleCaps[key] ? count(roleCaps[key]) : "—", costText(row)]);
  const sum = ["合计", count(total.calls), count(total.requests), count(total.input), count(total.output),
               count(total.input + total.output), ceilings.run_tokens ? count(ceilings.run_tokens) : "不设上限", costText(total)];
  sum.cls = "total";
  kids.push(table(["角色组", "调用", "请求", "输入 token", "输出 token", "token 合计", "token 上限", "成本"],
                  [...rows, sum], [1, 2, 3, 4, 5, 6, 7]));
  if (ceilings.run_tokens) {
    const used = total.input + total.output, bar = el("i");
    bar.style.width = Math.min(100, 100 * used / ceilings.run_tokens) + "%";
    kids.push(el("div", { class: "meter" + (used > ceilings.run_tokens ? " over" : "") }, bar));
  }
  const notes = ["“请求”多于“调用”的部分是输出不合契约后的纠正重试。",
                 "成本上限：" + (ceilings.run_cost ? num(ceilings.run_cost, 6) : "不设上限") + "。"];
  const exceeded = events.find((e) => e.type === "budget.exceeded");
  if (exceeded) notes.unshift("预算在第 " + exceeded.seq + " 条事件处超限（范围 " + exceeded.data.scope + "），此后不再发起模型调用。");
  kids.push(el("p", { class: "note" }, notes.join(" ")));
  fill($("usage"), kids);
}

/* ---------- 事件详情 ---------- */

function openDetail(seq) { state.selected = seq; state.follow = false; render(); }
function closeDetail() { state.selected = 0; render(); }

function renderDetail() {
  const box = $("detail"), e = state.events.find((event) => event.seq === state.selected);
  box.hidden = !e;
  if (!e) return;
  const d = e.data, lane = LANES.find(([key]) => key === e.actor);
  const pairs = [["事件", "#" + e.seq + " · " + e.type], ["执行者", (lane ? lane[1] : e.actor || "系统") + (e.step ? "（" + e.step + "）" : "")]];
  if (e.ts) pairs.push(["时间", e.ts]);
  if (e.caused_by && e.caused_by.length) pairs.push(["依据的事件", e.caused_by.map((seq) => "#" + seq).join(" ")]);
  const kids = [el("button", { class: "ctl close", type: "button", on: { click: closeDetail } }, "关闭"),
                el("h2", null, describe(e)[0])];
  const json = (value) => el("pre", null, JSON.stringify(value, null, 2));

  if (e.type === "model.called") {
    pairs.push(["模型", d.model || "—"], ["请求次数", d.usage.requests + (d.usage.requests > 1 ? "（含纠正重试）" : "")],
      ["token", "输入 " + count(d.usage.input_tokens) + "，输出 " + count(d.usage.output_tokens)],
      ["成本", d.cost === null || d.cost === undefined ? "未定价" : num(d.cost, 6)]);
    kids.push(el("dl", { class: "kv" }, pairs.map(([k, v]) => [el("dt", null, k), el("dd", null, v)])),
      el("h3", null, "提示词：这个角色能看到的全部内容"), el("pre", null, d.prompt || ""),
      el("h3", null, d.output === null ? "回复：纠正一次后仍不合契约，没有产物" : "回复：通过契约校验的输出"),
      d.output === null ? null : json(d.output),
      el("details", null, el("summary", null, "完整往来（模型库记录的每一条消息）"), json(d.messages)));
  } else if (e.type === "gate.checked") {
    pairs.push(["闸门", STAGE_NAME[d.gate] || d.gate], ["结论", d.findings ? "发现 " + d.findings + " 个问题" : "通过"]);
    kids.push(el("dl", { class: "kv" }, pairs.map(([k, v]) => [el("dt", null, k), el("dd", null, v)])));
    if (d.detail && d.detail.length) {
      kids.push(el("ul", { class: "findings" }, d.detail.map((item) => el("li", null,
        el("span", { class: "mono" }, "[" + item.check + "] " + (item.subject || "")),
        item.owner ? "（修改人：" + (STAGE_NAME[item.owner] || item.owner) + "）" : "", el("br"), item.message || ""))));
    }
  } else if (e.type === "artifact.written") {
    pairs.push(["黑板键", d.key], ["版本", "第 " + d.version + " 版"]);
    kids.push(el("dl", { class: "kv" }, pairs.map(([k, v]) => [el("dt", null, k), el("dd", null, v)])), json(d.value));
  } else {
    if (e.type === "route") pairs.push(["重跑", "从" + (STAGE_NAME[d.to] || d.to) + "开始，以及它之后的每一段"], ["原因", d.why || ""]);
    kids.push(el("dl", { class: "kv" }, pairs.map(([k, v]) => [el("dt", null, k), el("dd", null, v)])), json(d));
  }
  fill(box, kids);
}

/* ---------- 回放 ---------- */

const complete = () => state.ended && state.shown >= state.events.length;

function render() {
  const events = view();
  $("run").hidden = !(state.events.length || state.runId);
  const banner = $("banner");
  banner.hidden = !state.error;
  banner.textContent = state.error ? "这次运行没有正常结束：" + state.error + "。这是程序的问题，不是分析结论。" : "";
  renderHeader(); renderPipeline(events); renderResult(events); renderChart(events);
  renderTimeline(events); renderEvidence(events); renderUsage(events); renderDetail();
  $("btn-play").textContent = state.playing ? "暂停" : complete() ? "重新播放" : "播放";
  $("btn-play").classList.toggle("on", state.playing);
  for (const button of $("speeds").querySelectorAll("button")) button.classList.toggle("on", button.dataset.speed === state.speed);
  $("slider").max = String(state.events.length);
  $("slider").value = String(state.shown);
  $("progress").textContent = state.shown + " / " + state.events.length + (state.ended ? "" : " …");
}

function schedule() {
  clearTimeout(state.timer);
  if (!state.playing) return;
  if (state.speed === "instant") {                // 瞬间：到了就揭示
    state.shown = state.events.length;
    if (state.ended) state.playing = false;
    render();
    return;
  }
  state.timer = setTimeout(() => {
    if (state.shown < state.events.length) state.shown += 1;
    if (complete()) state.playing = false;
    render();
    schedule();
  }, PACE[state.speed]);
}

function play() {
  if (complete()) state.shown = 0;
  state.playing = true; state.follow = true;
  render(); schedule();
}
function pause() { state.playing = false; clearTimeout(state.timer); render(); }

$("btn-play").addEventListener("click", () => (state.playing ? pause() : play()));
$("btn-step").addEventListener("click", () => {
  pause();
  if (state.shown < state.events.length) { state.shown += 1; state.follow = true; render(); }
});
$("speeds").addEventListener("click", (ev) => {
  const speed = ev.target.dataset && ev.target.dataset.speed;
  if (!speed) return;
  state.speed = speed;
  if (speed === "instant" && !state.playing) { state.shown = state.events.length; state.follow = true; }
  render(); schedule();
});
$("slider").addEventListener("input", (ev) => {
  state.playing = false; clearTimeout(state.timer);
  state.shown = Number(ev.target.value); state.follow = true;
  render();
});
$("lanes").addEventListener("wheel", () => { state.follow = false; }, { passive: true });
document.addEventListener("keydown", (ev) => { if (ev.key === "Escape" && state.selected) closeDetail(); });

/* ---------- 实时模式：表单、过去的运行、事件流 ---------- */

async function getJSON(path, options) {
  const response = await fetch(path, options);
  let data = null;
  try { data = await response.json(); } catch (_) { data = null; }
  return { status: response.status, data };
}

function resetRun(runId) {
  if (state.source) state.source.close();
  clearTimeout(state.timer);
  Object.assign(state, { runId, events: [], shown: 0, ended: !runId, error: null, bars: null, currency: "",
                         barsAsked: false, playing: false, source: null, selected: 0, follow: true });
}

function openRun(runId, watch) {
  /* 打开一次运行并接上它的事件流。watch 为真时按阅读速度逐条揭示，否则到了就显示。 */
  resetRun(runId);
  const wanted = runId ? "?run=" + encodeURIComponent(runId) : window.location.pathname;
  if (window.location.search !== (runId ? wanted : "")) window.history.pushState(null, "", wanted);
  if (!runId) { $("history").open = true; render(); return; }
  $("history").open = false;                        // 列表可能很长：看一次运行时收起来，别把运行挤到页面外
  state.speed = watch ? "normal" : "instant";
  state.follow = watch;                             // 看现场时跟着最新一栏走；翻看旧运行时从头看起
  state.playing = true;
  const source = new EventSource("/api/runs/" + encodeURIComponent(runId) + "/events");
  state.source = source;
  source.addEventListener("journal", (message) => {
    const event = JSON.parse(message.data);
    if (state.events.length && event.seq <= state.events[state.events.length - 1].seq) return;
    state.events.push(event);
    if (!state.barsAsked && event.type === "artifact.written" && event.data.key === "request/scope") loadBars(runId);
    if (state.playing && state.speed === "instant") state.shown = state.events.length;
    render();
  });
  source.addEventListener("end", (message) => {     // 收尾消息之后必须关闭，否则浏览器会重连一个已结束的运行
    source.close();
    state.ended = true;
    state.error = JSON.parse(message.data).error;
    if (state.playing && state.speed === "instant") { state.shown = state.events.length; state.playing = false; }
    render();
    loadHistory();
  });
  source.onerror = () => {
    if (source.readyState !== EventSource.CLOSED || state.ended) return;      // 其余情况浏览器会自己重连
    state.ended = true; state.playing = false;
    state.error = state.events.length ? "与本地服务的连接中断" : "没有这个运行";
    render();
  };
  render(); schedule();
}

async function loadBars(runId) {
  state.barsAsked = true;
  const { status, data } = await getJSON("/api/runs/" + encodeURIComponent(runId) + "/bars");
  if (status !== 200 || state.runId !== runId || !data.bars.length) return;
  state.bars = data.bars; state.currency = data.currency;
  render();
}

async function loadHistory() {
  const { status, data } = await getJSON("/api/runs");
  const body = $("history-body");
  if (status !== 200) { body.textContent = "读不到运行列表。"; return; }
  if (!data.runs.length) { body.textContent = "还没有运行。"; return; }
  const when = (id) => id.slice(0, 4) + "-" + id.slice(4, 6) + "-" + id.slice(6, 8) + " "
    + id.slice(9, 11) + ":" + id.slice(11, 13) + ":" + id.slice(13, 15);
  fill(body, table(["开始时间", "代码", "分析日", "模型", "结果", "原因", ""], data.runs.map((run) => [
    when(run.run_id), run.ticker, run.as_of, MODE_TEXT[run.mode] || run.mode,
    el("span", { class: run.status === "delivered" ? "pass" : run.status === "review" ? "fail" : "na" },
       STATUS_TEXT[run.status] || run.status),
    run.reason === "ok" ? "" : reasonText(run.reason),
    el("button", { class: "linkish", type: "button", on: { click: () => { openRun(run.run_id, false); window.scrollTo(0, 0); } } }, "查看")])));
}

function applyScenario() {
  const name = $("f-scenario").value;
  const scenario = state.meta.scenarios.find((s) => s.name === name);
  const note = $("scenario-note");
  note.hidden = !scenario;
  for (const id of ["f-judges", "f-rounds"]) $(id).disabled = Boolean(scenario);   // 场景自带流程配置
  if (!scenario) return;
  $("f-ticker").value = scenario.ticker;
  $("f-date").value = scenario.as_of;
  note.textContent = "场景 " + scenario.name + "：" + scenario.about + " 评审与辩论轮数用场景自己的配置。";
}

async function submitForm(ev) {
  ev.preventDefault();
  const error = $("form-error");
  error.hidden = true;
  const body = {}, scenario = $("f-scenario").value, ticker = $("f-ticker").value.trim(), day = $("f-date").value;
  if (scenario) body.scenario = scenario;
  if (ticker) body.ticker = ticker;
  if (day) body.as_of = day;
  if (!scenario) {
    body.judges = $("f-judges").checked;
    if ($("f-rounds").value !== "") body.debate_rounds = Number($("f-rounds").value);
  }
  const { status, data } = await getJSON("/api/runs", { method: "POST", headers: { "Content-Type": "application/json" },
                                                        body: JSON.stringify(body) });
  if (status === 202) { openRun(data.run_id, true); return; }
  error.hidden = false;
  fill(error, "没有开始：" + ((data && data.error) || "请求不合格式（HTTP " + status + "）") + "。",
    data && data.active_run ? el("button", { class: "linkish", type: "button",
      on: { click: () => openRun(data.active_run, false) } }, "查看正在进行的运行") : null);
}

async function startLive() {
  state.live = true;
  $("launch").hidden = false;
  const { status, data } = await getJSON("/api/meta");
  if (status !== 200) { $("mode-note").textContent = "读不到本地服务的信息。"; return; }
  state.meta = data;
  const scripted = data.mode !== "model";
  fill($("f-scenario"), el("option", { value: "" }, scripted ? "（不用场景）" : "（不用场景，调用真实模型）"),
    data.scenarios.map((s) => el("option", { value: s.name }, s.name + " · " + s.ticker + " @ " + s.as_of)));
  fill($("tickers"), data.instruments.map((i) => el("option", { value: i.ticker }, i.name)));
  $("f-judges").checked = data.defaults.judges;
  $("f-rounds").value = data.defaults.debate_rounds;
  $("mode-note").textContent = scripted
    ? "当前没有可用的真实模型，回复来自预先编写的场景。不选场景时，只有被准入拒绝的请求（例如 THIN、STALE）能走完，其余会在第一次模型调用处以 REVIEW 结束。"
    : "真实模型：quick = " + data.models.quick + "，deep = " + data.models.deep + "。每次运行都会调用模型并产生费用。";
  if (scripted && data.scenarios.some((s) => s.name === "demo")) $("f-scenario").value = "demo";
  applyScenario();
  $("f-scenario").addEventListener("change", applyScenario);
  $("form").addEventListener("submit", submitForm);
  window.addEventListener("popstate", () => openRun(new URLSearchParams(window.location.search).get("run") || "", false));
  loadHistory();
  const runId = new URLSearchParams(window.location.search).get("run") || "";
  if (runId) openRun(runId, false); else { $("history").open = true; render(); }
}

/* ---------- 入口：静态内嵌，或实时 ---------- */

const embedded = JSON.parse($("embedded").textContent);
if (embedded) {
  state.events = embedded.events;
  state.bars = embedded.bars;
  state.shown = state.events.length;              // 打开就是最终状态；按"重新播放"从头看一遍
  state.speed = "normal";
  state.follow = false;
  render();
} else {
  startLive();
}
})();
</script>
</body>
</html>
