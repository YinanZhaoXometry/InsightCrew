[project]
name = "insightcrew"
version = "2.0.0"
description = "带独立审计的多智能体交易辅助系统（COMP5584 课程项目）"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14,<3",
    "pydantic-ai-slim[openai]>=2.68,<3",
    "pydantic-settings>=2.16,<3",
    "python-dotenv>=1.2,<2",
    "httpx2>=2.16,<3",
    "fastapi>=0.163,<1",
    "uvicorn>=0.54,<1",
    "typer>=0.29,<1",
]

[project.scripts]
insightcrew = "insightcrew.app.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.2,<10",
    "pytest-asyncio>=1.0",
    "ruff>=0.17",
    "pyright>=1.1.414",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["insightcrew"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC"]
ignore = ["RUF001", "RUF002", "RUF003"]   # 中文注释和提示词里的全角标点是有意为之

[tool.pyright]
include = ["insightcrew", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.uv]
exclude-newer = "2026-11-15T00:00:00Z"
